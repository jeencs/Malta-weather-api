name: Build and Push Docker Image

on:
  push:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: naibzada
          password: dckr_pat_s6-iPUs6bXNfJEDP8djp33UXjYM

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: naibzada/malta-weather-app:latest
