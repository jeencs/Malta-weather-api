version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: malta-weather-db
    environment:
      POSTGRES_DB: malta_weather
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - malta-weather-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malta-weather-api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - malta-weather-network

volumes:
  postgres_data:
    driver: local

networks:
  malta-weather-network:
    driver: bridge
